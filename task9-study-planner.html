<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Study Planner | Task 9</title>
  <meta name="description" content="Enter your subjects and exam dates — AI generates a personalized weekly timetable." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0a0a12; --card: #13131f; --border: rgba(255,255,255,0.07); --accent: #f97316; --accent-light: #fb923c; --text: #e2e8f0; --muted: #64748b; --radius: 14px; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }
    .bg-orb { position: fixed; border-radius: 50%; filter: blur(100px); opacity: 0.12; pointer-events: none; z-index: 0; }
    .orb-a { width: 500px; height: 500px; background: #f97316; top: -150px; right: -100px; }
    .orb-b { width: 400px; height: 400px; background: #ef4444; bottom: -100px; left: -100px; }

    nav { position: relative; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 20px 32px; border-bottom: 1px solid var(--border); }
    nav a { color: var(--muted); font-size: 13px; text-decoration: none; transition: color 0.2s; }
    nav a:hover { color: var(--text); }
    nav .sep { color: var(--border); }
    nav .title { font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 700; color: var(--accent-light); }

    .container { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; }
    .badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(249,115,22,0.12); border: 1px solid rgba(249,115,22,0.3); border-radius: 100px; padding: 4px 12px; font-size: 12px; color: var(--accent-light); margin-bottom: 20px; }
    h1 { font-family: 'Outfit', sans-serif; font-size: 32px; font-weight: 800; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: var(--muted); margin-bottom: 32px; }

    .setup-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; margin-bottom: 32px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    input, textarea, select { width: 100%; background: #0d0d1a; border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; padding: 12px 14px; outline: none; transition: border-color 0.2s; }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(249,115,22,0.12); }
    .field { margin-bottom: 16px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
    .api-row { display: flex; gap: 10px; }
    .api-row input { flex: 1; }
    .btn-load { padding: 10px 16px; border-radius: 10px; border: 1px solid rgba(249,115,22,0.3); background: rgba(249,115,22,0.12); color: var(--accent-light); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: Inter, sans-serif; transition: all 0.2s; }
    .btn-load:hover { background: rgba(249,115,22,0.25); }
    .btn-load:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 13px 24px; border-radius: 12px; border: none; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #f97316, #ef4444); color: #fff; width: 100%; justify-content: center; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(249,115,22,0.3); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-sm { padding: 9px 18px; font-size: 13px; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 10px; }
    .btn-sm:hover { border-color: var(--accent-light); color: var(--accent-light); }

    .loader { display: none; text-align: center; padding: 60px; }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Timetable */
    .timetable-area { display: none; }
    .timetable-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .timetable-title { font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 700; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .legend-dot { width: 12px; height: 12px; border-radius: 4px; }

    .grid-scroll { overflow-x: auto; }
    .timetable-grid { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); min-width: 640px; }
    .grid-header { display: grid; background: rgba(249,115,22,0.08); border-bottom: 1px solid var(--border); }
    .grid-header-cell { padding: 14px 12px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent-light); text-align: center; }
    .grid-row { display: grid; border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.2s; }
    .grid-row:hover { background: rgba(255,255,255,0.02); }
    .grid-row:last-child { border-bottom: none; }
    .time-cell { padding: 14px 12px; font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; display: flex; align-items: center; justify-content: center; }
    .slot { padding: 10px 8px; display: flex; align-items: center; justify-content: center; text-align: center; min-height: 52px; }
    .slot-inner { border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 600; width: 100%; line-height: 1.4; }
    .slot-empty { color: var(--border); font-size: 18px; }

    .error-msg { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #f87171; padding: 12px 16px; border-radius: 10px; font-size: 13px; margin-top: 12px; display: none; }

    @media (max-width: 600px) { .row2, .row3 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>

  <nav>
    <a href="index.html">🏠 Home</a>
    <span class="sep">›</span>
    <span class="title">📅 AI Study Planner</span>
  </nav>

  <div class="container">
    <div class="badge">📅 Task 9</div>
    <h1>AI Study Planner</h1>
    <p class="subtitle">Enter your subjects, available hours, and exam dates — AI generates a balanced weekly study timetable.</p>

    <div class="setup-card" id="setupCard">
      <div class="field">
        <label>RouteAPI Key</label>
        <div class="api-row">
          <input type="password" id="apiKey" placeholder="sk-..." />
          <button type="button" onclick="loadModels()" id="testBtn" class="btn-load">🔌 Load Models</button>
        </div>
        <div id="connStatus" style="font-size:12px;margin-top:6px;display:none;"></div>
      </div>
      <div class="field">
        <label>Model <span id="modelCount" style="color:#64748b;font-weight:400;"></span></label>
        <select id="modelSel">
          <option value="gpt-4o-mini">gpt-4o-mini</option>
          <option value="openai/gpt-4o-mini">openai/gpt-4o-mini</option>
          <option value="openai/gpt-4o">openai/gpt-4o</option>
          <option value="anthropic/claude-3-5-haiku">anthropic/claude-3-5-haiku</option>
          <option value="google/gemini-flash-1.5">google/gemini-flash-1.5</option>
        </select>
        <p style="font-size:11px;color:#475569;margin-top:5px;">Click "Load Models" above to fetch your actual available models.</p>
      </div>
      <div class="row2">
        <div class="field">
          <label>Subjects (one per line)</label>
          <textarea id="subjects" style="min-height:120px;" placeholder="Mathematics&#10;Physics&#10;Chemistry&#10;English&#10;History"></textarea>
        </div>
        <div class="field">
          <label>Exam Dates (one per line)</label>
          <textarea id="examDates" style="min-height:120px;" placeholder="Mathematics - Jan 20&#10;Physics - Jan 22&#10;Chemistry - Jan 25"></textarea>
        </div>
      </div>
      <div class="row3">
        <div class="field">
          <label>Study Hours / Day</label>
          <input type="number" id="hoursPerDay" value="4" min="1" max="12" />
        </div>
        <div class="field">
          <label>Week Starts On</label>
          <select id="weekStart">
            <option value="Monday">Monday</option>
            <option value="Sunday">Sunday</option>
          </select>
        </div>
        <div class="field">
          <label>Priority</label>
          <select id="priority">
            <option value="balanced">Balanced</option>
            <option value="exam-first">Exam-focused</option>
            <option value="weak-first">Weakest first</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary" id="genBtn" onclick="generatePlan()">✨ Generate Study Plan</button>
      <div class="error-msg" id="errorMsg"></div>
    </div>

    <div class="loader" id="loader"><div class="spinner"></div><p style="color:var(--muted);font-size:14px;">AI is building your timetable...</p></div>

    <div class="timetable-area" id="timetableArea">
      <div class="timetable-header">
        <div class="timetable-title">📅 Your Weekly Study Plan</div>
        <div style="display:flex;gap:10px;">
          <button class="btn btn-sm" onclick="window.print()">🖨 Print</button>
          <button class="btn btn-sm" onclick="resetPlan()">🔁 New Plan</button>
        </div>
      </div>
      <div class="legend" id="legend" style="margin-bottom:20px;"></div>
      <div class="grid-scroll">
        <div class="timetable-grid" id="timetableGrid"></div>
      </div>
    </div>
  </div>

  <script>
    const SUBJECT_COLORS = [
      { bg: 'rgba(124,58,237,0.18)', text: '#a78bfa', border: 'rgba(124,58,237,0.3)' },
      { bg: 'rgba(16,185,129,0.18)', text: '#34d399', border: 'rgba(16,185,129,0.3)' },
      { bg: 'rgba(249,115,22,0.18)', text: '#fb923c', border: 'rgba(249,115,22,0.3)' },
      { bg: 'rgba(14,165,233,0.18)', text: '#38bdf8', border: 'rgba(14,165,233,0.3)' },
      { bg: 'rgba(236,72,153,0.18)', text: '#f472b6', border: 'rgba(236,72,153,0.3)' },
      { bg: 'rgba(245,158,11,0.18)', text: '#fbbf24', border: 'rgba(245,158,11,0.3)' },
      { bg: 'rgba(20,184,166,0.18)', text: '#2dd4bf', border: 'rgba(20,184,166,0.3)' },
    ];

    async function generatePlan() {
      const key = document.getElementById('apiKey').value.trim();
      const subjects = document.getElementById('subjects').value.trim();
      const exams = document.getElementById('examDates').value.trim();
      const hours = document.getElementById('hoursPerDay').value;
      const weekStart = document.getElementById('weekStart').value;
      const priority = document.getElementById('priority').value;

      if (!key) { showError('Please enter your RouteAPI Key.'); return; }
      if (!subjects) { showError('Please enter your subjects.'); return; }

      const prompt = `Create a weekly study timetable for a student. Return ONLY valid JSON in exactly this format:
{
  "slots": ["Morning (8-10am)", "Mid (10am-12pm)", "Afternoon (2-4pm)", "Evening (6-8pm)"],
  "days": ["${weekStart === 'Monday' ? 'Mon,Tue,Wed,Thu,Fri,Sat,Sun' : 'Sun,Mon,Tue,Wed,Thu,Fri,Sat'}".split(',').join('","')],
  "timetable": {
    "Mon": {"Morning (8-10am)": "Mathematics", "Mid (10am-12pm)": "Physics", ...},
    ...
  }
}

Subjects: ${subjects}
Exam Dates: ${exams || 'Not specified'}
Available hours per day: ${hours}
Priority: ${priority}
Week starts on: ${weekStart}

Use exactly the slot and day keys shown. Leave a slot empty string "" for breaks/free time. Balance subjects based on priority. Return ONLY the JSON, no markdown.`;

      document.getElementById('setupCard').style.display = 'none';
      document.getElementById('loader').style.display = 'block';
      document.getElementById('errorMsg').style.display = 'none';
      document.getElementById('genBtn').disabled = true;

      try {
        const res = await fetch('https://api.routeapi.ai/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
          body: JSON.stringify({ model: document.getElementById('modelSel').value, messages: [{ role: 'user', content: prompt }], max_tokens: 1200 })
        });
        const json = await res.json();
        if (json.error) { showError(json.error.message); return; }
        let raw = json.choices[0].message.content.trim().replace(/```json|```/g, '').trim();
        const plan = JSON.parse(raw);
        renderTimetable(plan);
      } catch (e) { showError('Error: ' + e.message + '. Please try again.'); }
    }

    function renderTimetable(plan) {
      const { slots, days, timetable } = plan;
      const allSubjects = [...new Set(Object.values(timetable).flatMap(day => Object.values(day)).filter(Boolean))];
      const colorMap = {};
      allSubjects.forEach((s, i) => { colorMap[s] = SUBJECT_COLORS[i % SUBJECT_COLORS.length]; });

      const cols = days.length + 1;
      const gridStyle = `grid-template-columns: 100px repeat(${days.length}, 1fr);`;

      let html = `<div class="grid-header" style="${gridStyle}"><div class="grid-header-cell">Time</div>${days.map(d => `<div class="grid-header-cell">${d}</div>`).join('')}</div>`;

      slots.forEach(slot => {
        html += `<div class="grid-row" style="${gridStyle}"><div class="time-cell">${slot.replace(/ *\(.*?\)/,'')}<br/><span style="font-size:10px;opacity:0.6;">${slot.match(/\((.+?)\)/)?.[1]||''}</span></div>`;
        days.forEach(day => {
          const subject = timetable[day]?.[slot] || '';
          if (subject) {
            const c = colorMap[subject] || SUBJECT_COLORS[0];
            html += `<div class="slot"><div class="slot-inner" style="background:${c.bg};color:${c.text};border:1px solid ${c.border};">${subject}</div></div>`;
          } else {
            html += `<div class="slot"><span class="slot-empty">·</span></div>`;
          }
        });
        html += '</div>';
      });

      document.getElementById('timetableGrid').innerHTML = html;

      // Legend
      let legendHtml = '';
      allSubjects.forEach(s => {
        const c = colorMap[s];
        legendHtml += `<div class="legend-item"><div class="legend-dot" style="background:${c.text};"></div>${s}</div>`;
      });
      document.getElementById('legend').innerHTML = legendHtml;

      document.getElementById('loader').style.display = 'none';
      document.getElementById('timetableArea').style.display = 'block';
      document.getElementById('genBtn').disabled = false;
    }

    function resetPlan() {
      document.getElementById('timetableArea').style.display = 'none';
      document.getElementById('setupCard').style.display = 'block';
      document.getElementById('genBtn').disabled = false;
    }

    function showError(msg) {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('setupCard').style.display = 'block';
      document.getElementById('genBtn').disabled = false;
      const el = document.getElementById('errorMsg');
      el.textContent = '⚠ ' + msg;
      el.style.display = 'block';
    }

    async function loadModels() {
      const key = document.getElementById('apiKey').value.trim();
      const status = document.getElementById('connStatus');
      const btn = document.getElementById('testBtn');
      if (!key) { status.style.display = 'block'; status.style.color = '#f87171'; status.textContent = '⚠ Enter your API key first.'; return; }
      status.style.display = 'block'; status.style.color = '#94a3b8'; status.textContent = '🔌 Fetching models from RouteAPI...';
      btn.textContent = '⏳ Loading...'; btn.disabled = true;
      try {
        const res = await fetch('https://api.routeapi.ai/v1/models', {
          headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' }
        });
        const json = await res.json();
        if (res.ok && json.data && json.data.length > 0) {
          const sel = document.getElementById('modelSel');
          sel.innerHTML = '';
          json.data.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.id;
            opt.textContent = m.id;
            sel.appendChild(opt);
          });
          const preferred = ['gpt-4o-mini', 'openai/gpt-4o-mini'];
          for (const p of preferred) {
            if ([...sel.options].some(o => o.value === p)) { sel.value = p; break; }
          }
          document.getElementById('modelCount').textContent = `(${json.data.length} available)`;
          status.style.color = '#34d399';
          status.textContent = `✅ Connected! ${json.data.length} models loaded. Pick one above and generate.`;
        } else {
          status.style.color = '#f87171';
          status.textContent = '❌ ' + (json.error?.message || JSON.stringify(json).slice(0, 120));
        }
      } catch (e) {
        status.style.color = '#f87171';
        status.textContent = '❌ Network error: ' + e.message;
      }
      btn.textContent = '🔌 Load Models'; btn.disabled = false;
    }
  </script>
</body>
</html>
