<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Subject Chatbot | Task 7</title>
  <meta name="description" content="A subject-specific AI tutor chatbot with conversation history." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0a0a12; --card: #13131f; --border: rgba(255,255,255,0.07); --accent: #a855f7; --accent-light: #c084fc; --text: #e2e8f0; --muted: #64748b; --radius: 14px; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .bg-orb { position: fixed; border-radius: 50%; filter: blur(100px); opacity: 0.12; pointer-events: none; z-index: 0; }
    .orb-a { width: 500px; height: 500px; background: #a855f7; top: -150px; left: -100px; }
    .orb-b { width: 400px; height: 400px; background: #7c3aed; bottom: -100px; right: -100px; }

    nav { position: relative; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 16px 24px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    nav a { color: var(--muted); font-size: 13px; text-decoration: none; transition: color 0.2s; }
    nav a:hover { color: var(--text); }
    nav .sep { color: var(--border); }
    nav .title { font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 700; color: var(--accent-light); }
    nav .spacer { flex: 1; }
    .subject-sel { background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 13px; padding: 7px 12px; outline: none; }
    .subject-sel:focus { border-color: var(--accent); }

    .chat-wrapper { display: flex; flex-direction: column; flex: 1; overflow: hidden; position: relative; z-index: 1; }

    /* Setup bar */
    .setup-bar { display: flex; gap: 10px; align-items: center; padding: 12px 20px; background: rgba(168,85,247,0.06); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .setup-bar label { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .setup-bar input { background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 13px; padding: 8px 12px; outline: none; flex: 1; min-width: 180px; }
    .setup-bar input:focus { border-color: var(--accent); }
    .badge-pill { background: rgba(168,85,247,0.12); border: 1px solid rgba(168,85,247,0.3); color: var(--accent-light); padding: 4px 12px; border-radius: 100px; font-size: 12px; font-weight: 600; }
    .btn-clear { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 7px 14px; font-family: 'Inter', sans-serif; font-size: 12px; cursor: pointer; transition: all 0.2s; }
    .btn-clear:hover { border-color: #ef4444; color: #f87171; }
    .btn-load { padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(168,85,247,0.3); background: rgba(168,85,247,0.12); color: var(--accent-light); font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: Inter, sans-serif; transition: all 0.2s; }
    .btn-load:hover { background: rgba(168,85,247,0.25); }
    .btn-load:disabled { opacity: 0.6; cursor: not-allowed; }
    .model-sel { background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 13px; padding: 8px 12px; outline: none; min-width: 160px; max-width: 220px; }
    .model-sel:focus { border-color: var(--accent); }
    .setup-bar #connStatus { flex-basis: 100%; margin-top: 2px; }

    /* Messages */
    .messages { flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 20px; }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg { display: flex; gap: 12px; max-width: 80%; animation: msgIn 0.25s ease; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot { align-self: flex-start; }
    .avatar { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .user .avatar { background: linear-gradient(135deg, #a855f7, #7c3aed); }
    .bot .avatar { background: rgba(168,85,247,0.15); border: 1px solid rgba(168,85,247,0.3); }
    .bubble { padding: 14px 18px; border-radius: 16px; font-size: 14px; line-height: 1.7; }
    .user .bubble { background: linear-gradient(135deg, rgba(168,85,247,0.2), rgba(124,58,237,0.2)); border: 1px solid rgba(168,85,247,0.3); color: #f1f5f9; border-top-right-radius: 4px; }
    .bot .bubble { background: var(--card); border: 1px solid var(--border); color: var(--text); border-top-left-radius: 4px; }
    .bot .bubble h1,.bot .bubble h2,.bot .bubble h3 { color: var(--accent-light); font-size: 15px; margin-bottom: 6px; margin-top: 12px; }
    .bot .bubble h1:first-child,.bot .bubble h2:first-child { margin-top: 0; }
    .bot .bubble ul,.bot .bubble ol { padding-left: 18px; }
    .bot .bubble li { margin-bottom: 4px; }
    .bot .bubble p { margin-bottom: 6px; }
    .bot .bubble code { background: rgba(168,85,247,0.12); padding: 1px 6px; border-radius: 4px; font-size: 12px; color: var(--accent-light); }
    .bot .bubble pre { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 12px; margin: 8px 0; overflow-x: auto; }

    .typing { display: none; }
    .typing .bubble { display: flex; gap: 5px; align-items: center; padding: 16px 20px; }
    .dot-anim { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-light); animation: dotBounce 1.2s infinite; }
    .dot-anim:nth-child(2) { animation-delay: 0.2s; }
    .dot-anim:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotBounce { 0%,100% { transform: translateY(0); opacity: 0.4; } 50% { transform: translateY(-5px); opacity: 1; } }

    .welcome { text-align: center; margin: auto; color: var(--muted); }
    .welcome .icon { font-size: 56px; margin-bottom: 16px; }
    .welcome h2 { font-family: 'Outfit', sans-serif; font-size: 24px; color: var(--text); margin-bottom: 8px; }
    .welcome p { font-size: 14px; max-width: 340px; margin: 0 auto 20px; }
    .sample-qs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .sample-q { background: var(--card); border: 1px solid var(--border); border-radius: 100px; padding: 8px 16px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .sample-q:hover { border-color: var(--accent); color: var(--accent-light); }

    /* Input bar */
    .input-area { padding: 16px 20px; border-top: 1px solid var(--border); background: rgba(10,10,18,0.8); flex-shrink: 0; }
    .input-row { display: flex; gap: 10px; align-items: flex-end; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 8px 8px 8px 16px; transition: border-color 0.2s; }
    .input-row:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(168,85,247,0.1); }
    .input-row textarea { flex: 1; background: none; border: none; outline: none; color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; resize: none; max-height: 120px; line-height: 1.6; padding-top: 4px; }
    .send-btn { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, #a855f7, #7c3aed); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
    .send-btn:hover { transform: scale(1.05); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .send-btn svg { width: 18px; height: 18px; fill: white; }
  </style>
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>

  <nav>
    <a href="index.html">🏠 Home</a>
    <span class="sep">›</span>
    <span class="title">💬 AI Subject Chatbot</span>
    <div class="spacer"></div>
    <select class="subject-sel" id="subjectSel">
      <option value="Mathematics">📐 Mathematics</option>
      <option value="Physics">⚡ Physics</option>
      <option value="Chemistry">🧪 Chemistry</option>
      <option value="Biology">🧬 Biology</option>
      <option value="Computer Science">💻 Computer Science</option>
      <option value="History">📜 History</option>
      <option value="Economics">📈 Economics</option>
      <option value="General">🎓 General</option>
    </select>
  </nav>

  <div class="chat-wrapper">
    <div class="setup-bar">
      <label>API Key:</label>
      <input type="password" id="apiKey" placeholder="sk-..." />
      <button type="button" onclick="loadModels()" id="testBtn" class="btn-load">🔌 Load Models</button>
      <select id="modelSel" class="model-sel" title="AI model">
        <option value="gpt-4o-mini">gpt-4o-mini</option>
        <option value="openai/gpt-4o-mini">openai/gpt-4o-mini</option>
        <option value="openai/gpt-4o">openai/gpt-4o</option>
        <option value="anthropic/claude-3-5-haiku">anthropic/claude-3-5-haiku</option>
        <option value="google/gemini-flash-1.5">google/gemini-flash-1.5</option>
      </select>
      <span class="badge-pill" id="subjectBadge">📐 Mathematics Tutor</span>
      <span id="connStatus" style="font-size:12px;display:none;"></span>
      <button class="btn-clear" onclick="clearChat()">🗑 Clear Chat</button>
    </div>

    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="icon">🤖</div>
        <h2>Your AI Tutor</h2>
        <p>Ask me anything about <strong id="welcomeSubject">Mathematics</strong>. I'll explain concepts, solve problems, and give examples.</p>
        <div class="sample-qs">
          <div class="sample-q" onclick="sendSample(this.textContent)">What is a derivative?</div>
          <div class="sample-q" onclick="sendSample(this.textContent)">Explain integration by parts</div>
          <div class="sample-q" onclick="sendSample(this.textContent)">What is a matrix?</div>
          <div class="sample-q" onclick="sendSample(this.textContent)">Solve x² - 5x + 6 = 0</div>
        </div>
      </div>
    </div>

    <div class="msg bot typing" id="typingIndicator">
      <div class="avatar">🤖</div>
      <div class="bubble"><div class="dot-anim"></div><div class="dot-anim"></div><div class="dot-anim"></div></div>
    </div>

    <div class="input-area">
      <div class="input-row">
        <textarea id="userInput" placeholder="Ask your question..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    let history = [];

    document.getElementById('subjectSel').addEventListener('change', function() {
      const s = this.value;
      document.getElementById('subjectBadge').textContent = '🎓 ' + s + ' Tutor';
      document.getElementById('welcomeSubject').textContent = s;
    });

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }
    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }
    function sendSample(text) { document.getElementById('userInput').value = text; sendMessage(); }

    async function sendMessage() {
      const key = document.getElementById('apiKey').value.trim();
      const text = document.getElementById('userInput').value.trim();
      const subject = document.getElementById('subjectSel').value;
      if (!key) { alert('Please enter your RouteAPI Key in the bar above.'); return; }
      if (!text) return;

      document.getElementById('welcome')?.remove();
      appendMsg('user', text);
      document.getElementById('userInput').value = '';
      autoResize(document.getElementById('userInput'));
      setTyping(true);

      history.push({ role: 'user', content: text });
      const messages = [
        { role: 'system', content: `You are a helpful ${subject} tutor for students. Explain concepts clearly, use examples, and format your answers with markdown for readability.` },
        ...history
      ];

      try {
        const res = await fetch('https://api.routeapi.ai/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
          body: JSON.stringify({ model: document.getElementById('modelSel').value, messages, max_tokens: 900 })
        });
        const json = await res.json();
        if (json.error) throw new Error(json.error.message);
        const reply = json.choices[0].message.content;
        history.push({ role: 'assistant', content: reply });
        setTyping(false);
        appendMsg('bot', reply);
      } catch (e) { setTyping(false); appendMsg('bot', '⚠ Error: ' + e.message); }
    }

    function appendMsg(role, text) {
      const el = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      const avatar = role === 'user' ? '👤' : '🤖';
      const content = role === 'bot' ? marked.parse(text) : escHtml(text);
      div.innerHTML = `<div class="avatar">${avatar}</div><div class="bubble">${content}</div>`;
      el.appendChild(div);
      el.scrollTop = el.scrollHeight;
    }

    function setTyping(show) {
      const el = document.getElementById('typingIndicator');
      el.style.display = show ? 'flex' : 'none';
      document.getElementById('sendBtn').disabled = show;
      const msgs = document.getElementById('messages');
      if (show) { msgs.appendChild(el); msgs.scrollTop = msgs.scrollHeight; }
    }

    function clearChat() {
      history = [];
      document.getElementById('messages').innerHTML = '';
    }

    function escHtml(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    async function loadModels() {
      const key = document.getElementById('apiKey').value.trim();
      const status = document.getElementById('connStatus');
      const btn = document.getElementById('testBtn');
      if (!key) { status.style.display = 'block'; status.style.color = '#f87171'; status.textContent = '⚠ Enter your API key first.'; return; }
      status.style.display = 'block'; status.style.color = '#94a3b8'; status.textContent = '🔌 Fetching models from RouteAPI...';
      btn.textContent = '⏳ Loading...'; btn.disabled = true;
      try {
        const res = await fetch('https://api.routeapi.ai/v1/models', {
          headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' }
        });
        const json = await res.json();
        if (res.ok && json.data && json.data.length > 0) {
          const sel = document.getElementById('modelSel');
          sel.innerHTML = '';
          json.data.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.id;
            opt.textContent = m.id;
            sel.appendChild(opt);
          });
          const preferred = ['gpt-4o-mini', 'openai/gpt-4o-mini'];
          for (const p of preferred) {
            if ([...sel.options].some(o => o.value === p)) { sel.value = p; break; }
          }
          status.style.color = '#34d399';
          status.textContent = `✅ Connected! ${json.data.length} models loaded.`;
        } else {
          status.style.color = '#f87171';
          status.textContent = '❌ ' + (json.error?.message || JSON.stringify(json).slice(0, 120));
        }
      } catch (e) {
        status.style.color = '#f87171';
        status.textContent = '❌ Network error: ' + e.message;
      }
      btn.textContent = '🔌 Load Models'; btn.disabled = false;
    }
  </script>
</body>
</html>
